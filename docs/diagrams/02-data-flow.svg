<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#94a3b8"/></marker><linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c4b75"/><stop offset="0.5" stop-color="white"/><stop offset="1" stop-color="#91221c"/></linearGradient></defs><rect width="1440" height="900" fill="#f1f5f9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="60" y="75" font-size="38" fill="#0f172a" font-weight="700">02 / 从输入到成图</text><text x="60" y="117" font-size="21" fill="#334155" font-weight="400">先保证数据语义，再解析图形参数，最后检查实际图片。</text><rect x="60" y="190" width="420" height="180" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="208" width="5" height="28" rx="2" fill="#2563eb"/><text x="82" y="233" font-size="25" fill="#2563eb" font-weight="700">① 输入与来源</text><text x="82" y="272" font-size="20" fill="#334155" font-weight="400">文本 / 手工 / Excel</text><text x="82" y="303" font-size="20" fill="#334155" font-weight="400">保留原始值、公式缓存和来源</text><rect x="510" y="190" width="420" height="180" rx="16" fill="white" stroke="#dbe3ee"/><rect x="510" y="208" width="5" height="28" rx="2" fill="#2563eb"/><text x="532" y="233" font-size="25" fill="#2563eb" font-weight="700">② 校验与当前数据</text><text x="532" y="272" font-size="20" fill="#334155" font-weight="400">类型、元素、重复值、有限数</text><text x="532" y="303" font-size="20" fill="#334155" font-weight="400">Excel 来源快照 + 每组编辑缓冲</text><rect x="960" y="190" width="420" height="180" rx="16" fill="white" stroke="#dbe3ee"/><rect x="960" y="208" width="5" height="28" rx="2" fill="#2563eb"/><text x="982" y="233" font-size="25" fill="#2563eb" font-weight="700">③ 参数与图形规则</text><text x="982" y="272" font-size="20" fill="#334155" font-weight="400">布局、norm、cmap、显示精度</text><text x="982" y="303" font-size="20" fill="#334155" font-weight="400">元素覆盖、颜色条、物理尺寸</text><path d="M480 280 L510 280" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M930 280 L960 280" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1170 370 L1170 450" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="960" y="450" width="420" height="190" rx="16" fill="white" stroke="#dbe3ee"/><rect x="960" y="468" width="5" height="28" rx="2" fill="#0f766e"/><text x="982" y="493" font-size="25" fill="#0f766e" font-weight="700">④ 绘制 Figure</text><text x="982" y="532" font-size="20" fill="#334155" font-weight="400">共享 render_table 内核</text><text x="982" y="563" font-size="20" fill="#334155" font-weight="400">颜色 = 原始值 → norm → cmap</text><text x="982" y="594" font-size="20" fill="#334155" font-weight="400">舍入仅影响显示</text><rect x="510" y="450" width="420" height="190" rx="16" fill="white" stroke="#dbe3ee"/><rect x="510" y="468" width="5" height="28" rx="2" fill="#0f766e"/><text x="532" y="493" font-size="25" fill="#0f766e" font-weight="700">⑤ 预览 / 正式导出</text><text x="532" y="532" font-size="20" fill="#334155" font-weight="400">预览：低分辨率 + 命中区域</text><text x="532" y="563" font-size="20" fill="#334155" font-weight="400">导出：指定画幅、DPI、裁切</text><text x="532" y="594" font-size="20" fill="#334155" font-weight="400">UI 选中框不进入成图</text><rect x="60" y="450" width="420" height="190" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="468" width="5" height="28" rx="2" fill="#0f766e"/><text x="82" y="493" font-size="25" fill="#0f766e" font-weight="700">⑥ 文件与可恢复项目</text><text x="82" y="532" font-size="20" fill="#334155" font-weight="400">图片自动命名，避免覆盖</text><text x="82" y="563" font-size="20" fill="#334155" font-weight="400">项目保存参数、数据与编辑状态</text><text x="82" y="594" font-size="20" fill="#334155" font-weight="400">切组、撤销不删除已导出图片</text><path d="M960 545 L930 545" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 545 L480 545" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="680" width="1320" height="110" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="698" width="5" height="28" rx="2" fill="#b45309"/><text x="82" y="723" font-size="25" fill="#b45309" font-weight="700">关键不变量</text><text x="82" y="762" font-size="20" fill="#334155" font-weight="400">隐藏 ≠ 删除原值；界面缩放 ≠ 改变画幅；颜色条标签 ≠ 数值归一化。</text><text x="60" y="842" font-size="19" fill="#334155" font-weight="400">Excel 公式只读取已保存缓存；当前没有自动重算公式或自动源文件同步。</text><text x="60" y="878" font-size="16" fill="#64748b" font-weight="400">周期表绘图工作台 · v1.8.0 基线 · 说明图 / 2026-11-12</text></g></svg>