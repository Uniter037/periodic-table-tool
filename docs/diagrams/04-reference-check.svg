<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#94a3b8"/></marker><linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c4b75"/><stop offset="0.5" stop-color="white"/><stop offset="1" stop-color="#91221c"/></linearGradient></defs><rect width="1440" height="900" fill="#f1f5f9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="60" y="75" font-size="38" fill="#0f172a" font-weight="700">04 / 如何复现样板</text><text x="60" y="117" font-size="21" fill="#334155" font-weight="400">示意色条横置以便讲解；实际样板为竖直色条，底部低值、顶部高值。</text><rect x="60" y="170" width="640" height="200" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="188" width="5" height="28" rx="2" fill="#2563eb"/><text x="82" y="213" font-size="25" fill="#2563eb" font-weight="700">① 数据与显示元素</text><text x="82" y="252" font-size="20" fill="#334155" font-weight="400">选定工作表、条件和数值区域</text><text x="82" y="283" font-size="20" fill="#334155" font-weight="400">记录原始值、显示舍入与来源 hash</text><text x="82" y="314" font-size="20" fill="#334155" font-weight="400">分别设置数值隐藏、着色隐藏、参与自动范围</text><rect x="740" y="170" width="640" height="200" rx="16" fill="white" stroke="#dbe3ee"/><rect x="740" y="188" width="5" height="28" rx="2" fill="#2563eb"/><text x="762" y="213" font-size="25" fill="#2563eb" font-weight="700">② 几何与文字</text><text x="762" y="252" font-size="20" fill="#334155" font-weight="400">对齐布局、物理画幅、格距、字体与字号</text><text x="762" y="283" font-size="20" fill="#334155" font-weight="400">margins：left / bottom / right / top</text><text x="762" y="314" font-size="20" fill="#334155" font-weight="400">cbar_box：x / y / width / height</text><rect x="60" y="410" width="640" height="285" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="428" width="5" height="28" rx="2" fill="#0f766e"/><text x="82" y="453" font-size="25" fill="#0f766e" font-weight="700">③ 样板颜色条：Dis1.39</text><text x="82" y="492" font-size="20" fill="#334155" font-weight="400">深蓝 → 白 → 深红；双斜率归一化</text><text x="82" y="523" font-size="20" fill="#334155" font-weight="400">中心值位于色条中点，不能只改标签</text><rect x="95" y="555" width="560" height="46" rx="4" fill="url(#heat)" stroke="#94a3b8"/><text x="95" y="635" font-size="23" fill="#334155" font-weight="400">0.7238</text><text x="330" y="635" font-size="23" fill="#334155" font-weight="400">0.7318</text><text x="565" y="635" font-size="23" fill="#334155" font-weight="400">0.7592</text><rect x="740" y="410" width="640" height="285" rx="16" fill="white" stroke="#dbe3ee"/><rect x="740" y="428" width="5" height="28" rx="2" fill="#b45309"/><text x="762" y="453" font-size="25" fill="#b45309" font-weight="700">④ 验收与允许差异</text><text x="762" y="492" font-size="20" fill="#334155" font-weight="400">核对元素填充色与色条端点 / 中心</text><text x="762" y="523" font-size="20" fill="#334155" font-weight="400">比较文字、位置、裁切与最终尺寸</text><text x="762" y="554" font-size="20" fill="#334155" font-weight="400">科学模式锕系范围为 89～103</text><text x="762" y="585" font-size="20" fill="#334155" font-weight="400">记录字体、抗锯齿和源参数精度的不确定性</text><text x="762" y="616" font-size="20" fill="#334155" font-weight="400">接口测试通过不等于样板复现通过</text><text x="60" y="760" font-size="25" fill="#0f172a" font-weight="700">交付：项目文件 + 三格式图片 + 参数记录 + 参考 / 结果对照 + 差异说明</text><text x="60" y="842" font-size="19" fill="#334155" font-weight="400">无事先约定的像素差分阈值时，应标注“近似复现”，不承诺像素完全一致。</text><text x="60" y="878" font-size="16" fill="#64748b" font-weight="400">周期表绘图工作台 · v1.8.0 基线 · 说明图 / 2026-11-12</text></g></svg>