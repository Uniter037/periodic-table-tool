<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#94a3b8"/></marker><linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c4b75"/><stop offset="0.5" stop-color="white"/><stop offset="1" stop-color="#91221c"/></linearGradient></defs><rect width="1440" height="900" fill="#f1f5f9"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="60" y="75" font-size="38" fill="#0f172a" font-weight="700">03 / Agent 项目编辑协议</text><text x="60" y="117" font-size="21" fill="#334155" font-weight="400">本地 JSON 单请求接口；文件 revision 与 GUI 内存状态不是同一概念。</text><rect x="60" y="205" width="248" height="155" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="223" width="5" height="28" rx="2" fill="#2563eb"/><text x="82" y="248" font-size="25" fill="#2563eb" font-weight="700">1 · describe</text><text x="82" y="287" font-size="20" fill="#334155" font-weight="400">查询字段、默认值</text><text x="82" y="318" font-size="20" fill="#334155" font-weight="400">和可用样式</text><path d="M308 282 L328 282" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="328" y="205" width="248" height="155" rx="16" fill="white" stroke="#dbe3ee"/><rect x="328" y="223" width="5" height="28" rx="2" fill="#2563eb"/><text x="350" y="248" font-size="25" fill="#2563eb" font-weight="700">2 · inspect</text><text x="350" y="287" font-size="20" fill="#334155" font-weight="400">读取项目</text><text x="350" y="318" font-size="20" fill="#334155" font-weight="400">取得文件 SHA-256</text><path d="M576 282 L596 282" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="596" y="205" width="248" height="155" rx="16" fill="white" stroke="#dbe3ee"/><rect x="596" y="223" width="5" height="28" rx="2" fill="#2563eb"/><text x="618" y="248" font-size="25" fill="#2563eb" font-weight="700">3 · validate</text><text x="618" y="287" font-size="20" fill="#334155" font-weight="400">内存试算 patch</text><text x="618" y="318" font-size="20" fill="#334155" font-weight="400">不写项目文件</text><path d="M844 282 L864 282" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="864" y="205" width="248" height="155" rx="16" fill="white" stroke="#dbe3ee"/><rect x="864" y="223" width="5" height="28" rx="2" fill="#2563eb"/><text x="886" y="248" font-size="25" fill="#2563eb" font-weight="700">4 · update</text><text x="886" y="287" font-size="20" fill="#334155" font-weight="400">携带</text><text x="886" y="318" font-size="20" fill="#334155" font-weight="400">expected_revision</text><path d="M1112 282 L1132 282" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="1132" y="205" width="248" height="155" rx="16" fill="white" stroke="#dbe3ee"/><rect x="1132" y="223" width="5" height="28" rx="2" fill="#2563eb"/><text x="1154" y="248" font-size="25" fill="#2563eb" font-weight="700">5 · export</text><text x="1154" y="287" font-size="20" fill="#334155" font-weight="400">使用更新后的</text><text x="1154" y="318" font-size="20" fill="#334155" font-weight="400">revision</text><rect x="60" y="430" width="640" height="230" rx="16" fill="white" stroke="#dbe3ee"/><rect x="60" y="448" width="5" height="28" rx="2" fill="#0f766e"/><text x="82" y="473" font-size="25" fill="#0f766e" font-weight="700">成功路径</text><text x="82" y="512" font-size="20" fill="#334155" font-weight="400">validate 返回 base_revision</text><text x="82" y="543" font-size="20" fill="#334155" font-weight="400">update 返回新的 revision</text><text x="82" y="574" font-size="20" fill="#334155" font-weight="400">export 返回路径、字节数与 SHA-256</text><text x="82" y="605" font-size="20" fill="#334155" font-weight="400">新项目先 create；图片支持 PNG / SVG / PDF</text><rect x="740" y="430" width="640" height="230" rx="16" fill="white" stroke="#dbe3ee"/><rect x="740" y="448" width="5" height="28" rx="2" fill="#b45309"/><text x="762" y="473" font-size="25" fill="#b45309" font-weight="700">冲突与失败路径</text><text x="762" y="512" font-size="20" fill="#334155" font-weight="400">REVISION_CONFLICT → 再次 inspect</text><text x="762" y="543" font-size="20" fill="#334155" font-weight="400">重新评估 patch，不能盲目覆盖</text><text x="762" y="574" font-size="20" fill="#334155" font-weight="400">原地 API 更新使用协作锁与原子替换</text><text x="762" y="605" font-size="20" fill="#334155" font-weight="400">GUI 未参与 API 锁，建议关闭或另存后重开</text><text x="60" y="730" font-size="23" fill="#0f172a" font-weight="400">CLI：python -m application.agent_api --request request.json --response response.json</text><text x="60" y="772" font-size="23" fill="#334155" font-weight="400">调用方同时检查：进程退出码 + 响应文件存在 + JSON ok 字段。</text><text x="60" y="842" font-size="19" fill="#334155" font-weight="400">validate 不会保存修改；同一项目被其他工具修改后，旧 revision 必须失效。</text><text x="60" y="878" font-size="16" fill="#64748b" font-weight="400">周期表绘图工作台 · v1.8.0 基线 · 说明图 / 2026-11-12</text></g></svg>