[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "periodic-table-tool"
version = "1.2.1"
description = "元素周期表绘图工具（13 种样式与原脚本输出一致 + 自定义扩展）"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
