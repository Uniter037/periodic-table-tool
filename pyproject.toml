[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "periodic-table-tool"
version = "1.7.0"
description = "元素周期表绘图工具（13 种样式与原脚本输出一致 + 自定义扩展）"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.24",
    "Pillow>=9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.*", "ui", "ui.*", "application", "application.*", "infrastructure", "infrastructure.*", "domain", "domain.*"]
namespaces = false
